[package]
name = "unicorn-engine-sys"
version = "2.1.5"
edition = "2024"
license = "GPL-2.0"
links = "unicorn"
build = "build.rs"

[features]
arch_aarch64 = ["arch_arm"]
arch_all = [
    "arch_x86",
    "arch_arm",
    "arch_aarch64",
    "arch_riscv",
    "arch_mips",
    "arch_sparc",
    "arch_m68k",
    "arch_ppc",
    "arch_s390x",
    "arch_tricore",
]
arch_arm = []
arch_m68k = []
arch_mips = []
arch_ppc = []
arch_riscv = []
arch_s390x = []
arch_sparc = []
arch_tricore = []
arch_x86 = []
default = ["arch_all"]
dynamic_linkage = []

[lib]
name = "unicorn_engine_sys"
path = "src/lib.rs"
