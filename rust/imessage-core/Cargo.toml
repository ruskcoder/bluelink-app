[package]
name = "imessage_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.3.0"
rustpush = { path = "../rustpush", features = ["macos-validation-data", "remote-anisette-v3"] }
keystore = { path = "../rustpush/keystore" }
plist = "1.5.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
anyhow = "1.0.75"
uniffi = { git = "https://github.com/mozilla/uniffi-rs", features = [ "cli", "tokio" ] }
async-recursion = "1.0.5"
prost = "0.12"
# Only necessary if using Protobuf well-known types:
prost-types = "0.12"
multi_log = "0.1.2"
rand = "0.8.5"
flexi_logger = "0.28.5"
log = "0.4.22"
pretty_env_logger = "0.5.0"
uuid = { version = "1.4.1", features = ["v4"] }
futures = "0.3.30"
base64 = "0.22.1"
sha2 = "0.10.8"
rasn = "0.16.0"
openssl = { version = "0.10.56", features = ["vendored"] }
aes-gcm = "0.10.3"

[features]
# Computes Mac validation data on the device. Needs the closed-source backend in `private/` at the
# repository root, and a prebuilt libunicorn.so; Gradle turns it on when that checkout is present.
native-nac = ["rustpush/native-nac"]

[patch.crates-io]
unicorn-engine-sys = { path = "../vendor/unicorn-engine-sys" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14.1"

[build-dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs", features = [ "build" ] }
prost-build = { version = "0.12" }

[[bin]]
# This can be whatever name makes sense for your project, but the rest of this tutorial assumes uniffi-bindgen.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[profile.release]
# Drops DWARF, which is nearly all of the ~700MB an unstripped build weighs, while keeping the
# symbol table. Deliberately not "symbols": that also removes `.symtab`, which is where
# uniffi-bindgen's library mode reads the exported interface from — stripping it makes binding
# generation silently produce nothing. AGP strips the symbol table again when packaging the APK.
strip = "debuginfo"
